# Cyber-Lab-v2 — Terraform CI pipeline
# Stage 1 of the promotion path: validate before anything applies.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  TF_DIR: '04-Terraform'
  TF_VERSION: '1.9.8'

steps:
  - checkout: self
    displayName: 'Checkout Cyber-Lab-v2'

  - task: TerraformInstaller@1
    displayName: 'Install Terraform $(TF_VERSION)'
    inputs:
      terraformVersion: $(TF_VERSION)

  - script: terraform version
    displayName: 'Terraform version check'

  - script: terraform fmt -check -recursive
    displayName: 'Terraform fmt — formatting gate'
    workingDirectory: $(TF_DIR)

  - script: terraform init -backend=false
    displayName: 'Terraform init (no backend)'
    workingDirectory: $(TF_DIR)

  - script: terraform validate
    displayName: 'Terraform validate — syntax & consistency gate'
    workingDirectory: $(TF_DIR)